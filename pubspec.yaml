name: dropdown_textfield
description: >-
  A material design TextField that opens a searchable dropdown list on tap,
  supporting single and multi-value selection.
version: 1.3.1
homepage: https://github.com/srtraj/dropdown_textfield

topics:
  - dropdown
  - textfield
  - form
  - selection
  - widget

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # No assets or fonts required.
